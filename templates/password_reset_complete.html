<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Reset Complete | Naxytech Gadgets</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border-color: rgba(255, 255, 255, 0.12);
      --primary: #00f2fe;
      --primary-hover: #4facfe;
      --success: #10b981;
      --accent: #7928ca;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 15% 15%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(121, 40, 202, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
    }

    .reset-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      margin: auto;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .brand-logo span {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Success Icon */
    .success-icon-wrapper {
      width: 72px;
      height: 72px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: var(--success);
    }

    .success-icon-wrapper svg {
      width: 38px;
      height: 38px;
    }

    .reset-card h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .reset-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-login {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #000000;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
    }

    footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <div class="reset-card">
    <a href="/" class="brand-logo">
      ⚡ <span>Naxytech</span> Gadgets
    </a>

    <div class="success-icon-wrapper">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <h2>Password Updated!</h2>
    <p>Your security credentials have been updated successfully. You can now use your new password to sign into your Naxytech account.</p>

    <a href="/login/" class="btn-login">Log In to Naxytech</a>
  </div>

  <footer>
    &copy; 2026 Naxytech Gadgets Inc. All rights reserved.
  </footer>

</body>
</html>
