<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set New Password | Naxytech Gadgets</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border-color: rgba(255, 255, 255, 0.12);
      --primary: #00f2fe;
      --primary-hover: #4facfe;
      --accent: #7928ca;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 15% 15%, rgba(0, 242, 254, 0.12) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(121, 40, 202, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
    }

    .reset-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      margin: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .brand-logo span {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .reset-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .reset-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Form & Input Fields */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.15);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Password Requirements Checklist */
    .password-rules {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      padding-left: 18px;
      line-height: 1.6;
    }

    .btn-submit {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #000000;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
    }

    footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <div class="reset-card">
    <a href="/" class="brand-logo">
      ⚡ <span>Naxytech</span> Gadgets
    </a>

    <h2>Set New Password</h2>
    <p>Please enter your new security credentials below.</p>

    <!-- Django/Standard Form Compatible -->
    <form method="POST">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="id_new_password1">New Password</label>
        <input type="password" name="new_password1" id="id_new_password1" placeholder="••••••••••••" required />
      </div>

      <div class="form-group">
        <label for="id_new_password2">Confirm New Password</label>
        <input type="password" name="new_password2" id="id_new_password2" placeholder="••••••••••••" required />
      </div>

      <ul class="password-rules">
        <li>At least 8 characters long</li>
        <li>Must contain numbers or special characters</li>
        <li>Cannot be identical to your old password</li>
      </ul>

      <button type="submit" class="btn-submit">Reset Password</button>
    </form>
  </div>

  <footer>
    &copy; 2026 Naxytech Gadgets Inc. All rights reserved.
  </footer>

</body>
</html>
